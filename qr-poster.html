<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cell Curator 서혜영 · 모바일 명함 QR 포스터 (A4)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF7EE;
    --ink: #2A1F12;
    --gold: #C8941E;
    --navy: #665847;
    --navy-deep: #524636;
    --cyan: #E3D5BF;
    --white: #fff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    background: #4a4540;
    display: flex;
    justify-content: center;
    padding: 24px;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ===== A4 시트 (210 x 297mm) ===== */
  .sheet {
    width: 210mm;
    height: 297mm;
    background: var(--cream);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  /* 상단 네이비 헤더 */
  .p-head {
    background: var(--navy);
    color: var(--white);
    padding: 26mm 20mm 20mm;
    text-align: center;
    position: relative;
  }
  .p-head::after {
    content: '';
    position: absolute;
    left: 50%; bottom: 13mm;
    transform: translateX(-50%);
    width: 16mm; height: 2px;
    background: var(--gold);
  }
  .p-eyebrow {
    font-size: 11pt;
    letter-spacing: 0.32em;
    font-weight: 700;
    color: var(--cyan);
    margin-bottom: 6mm;
  }
  .p-name {
    font-size: 40pt;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .p-name small {
    font-size: 17pt;
    font-weight: 600;
    opacity: 0.92;
    margin-left: 3mm;
    letter-spacing: 0;
  }
  .p-role {
    margin-top: 5mm;
    font-size: 12.5pt;
    color: rgba(255,255,255,0.82);
    letter-spacing: 0.02em;
    margin-bottom: 6mm;
  }

  /* 본문 */
  .p-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14mm 20mm 0;
    text-align: center;
  }
  .p-lead {
    font-size: 15pt;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.5;
    margin-bottom: 9mm;
    word-break: keep-all;
  }
  .p-lead .en {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17pt;
    letter-spacing: 0.04em;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 2mm;
  }

  /* QR 카드 (스캔 프레임) */
  .qr-card {
    position: relative;
    background: var(--white);
    border-radius: 8mm;
    padding: 11mm;
    box-shadow: 0 10mm 22mm rgba(34,58,107,0.16);
  }
  .qr-card img { display: block; width: 78mm; height: 78mm; }
  /* 모서리 스캔 틱 */
  .qr-card .tick {
    position: absolute;
    width: 9mm; height: 9mm;
    border: 1.1mm solid var(--gold);
  }
  .qr-card .tl { top: 5mm; left: 5mm; border-right: none; border-bottom: none; border-radius: 3mm 0 0 0; }
  .qr-card .tr { top: 5mm; right: 5mm; border-left: none; border-bottom: none; border-radius: 0 3mm 0 0; }
  .qr-card .bl { bottom: 5mm; left: 5mm; border-right: none; border-top: none; border-radius: 0 0 0 3mm; }
  .qr-card .br { bottom: 5mm; right: 5mm; border-left: none; border-top: none; border-radius: 0 0 3mm 0; }

  .p-scan {
    margin-top: 9mm;
    font-size: 14pt;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .p-scan span { color: var(--navy); }
  .p-sub {
    margin-top: 2.5mm;
    font-size: 11pt;
    color: #8A8174;
  }
  .p-url {
    margin-top: 7mm;
    display: inline-block;
    font-size: 11.5pt;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.02em;
    padding: 2.5mm 7mm;
    border: 1.4px solid rgba(44,71,129,0.35);
    border-radius: 100px;
  }

  /* 연락처(풀 버전 전용) */
  .p-contacts {
    margin-top: 8mm;
    display: flex;
    gap: 8mm;
    justify-content: center;
    flex-wrap: wrap;
    font-size: 11pt;
    color: var(--ink);
  }
  .p-contacts div { display: flex; align-items: center; gap: 2mm; }
  .p-contacts b { color: var(--navy); font-weight: 700; }

  /* 하단 */
  .p-foot {
    padding: 9mm 20mm 11mm;
    text-align: center;
    font-size: 9pt;
    letter-spacing: 0.28em;
    color: #B3A892;
    font-weight: 600;
  }

  /* ===== 시안 토글 ===== */
  body.v-simple .p-contacts { display: none; }
  body.v-full   .qr-card img { width: 70mm; height: 70mm; }
  body.v-full   .p-url { margin-top: 6mm; }

  /* ===== 인쇄 ===== */
  @page { size: A4; margin: 0; }
  @media print {
    body { background: none; padding: 0; }
    .sheet { box-shadow: none; width: 210mm; height: 297mm; }
  }
</style>
</head>
<body class="v-simple">
  <div class="sheet">
    <div class="p-head">
      <div class="p-eyebrow">CELL CURATOR&trade; · USANA</div>
      <div class="p-name">서혜영<small>SEO HYEYOUNG</small></div>
      <div class="p-role">Cell Curator · USANA 브랜드파트너</div>
    </div>

    <div class="p-body">
      <p class="p-lead">
        <span class="en">CELL CURATION</span>
        세포를 이해하면 삶이 달라집니다.<br/>세포의 신호를 읽고, 건강한 삶을 큐레이팅합니다.
      </p>

      <div class="qr-card">
        <span class="tick tl"></span><span class="tick tr"></span>
        <span class="tick bl"></span><span class="tick br"></span>
        <img src="assets/qr-code.png?v=3" alt="모바일 명함 QR코드" />
      </div>

      <div class="p-scan">휴대폰 카메라로 <span>QR을 스캔</span>하세요</div>
      <div class="p-sub">스캔하면 서혜영 대표의 모바일 명함이 바로 열립니다</div>
      <div class="p-url">usana-hyemi.kr</div>

      <div class="p-contacts">
        <div><b>전화</b> 010-2015-1265</div>
        <div><b>인스타</b> @usana_queen</div>
      </div>
    </div>

    <div class="p-foot">TRUE HEALTH · EVERY DAY · USANA</div>
  </div>
  <script>
    // ?v=full → 연락처 포함 시안 / 기본 = 심플
    if (new URLSearchParams(location.search).get('v') === 'full') {
      document.body.className = 'v-full';
    }
  </script>
</body>
</html>
